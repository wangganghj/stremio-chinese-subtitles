services:
  subtitles:
    image: ghcr.io/wangganghj/stremio-chinese-subtitles:latest
    container_name: stremio-subtitles
    restart: unless-stopped
    environment:
      PORT: "7000"
      PUBLIC_URL: "https://sub.example.com"
      ASSRT_TOKEN: "REPLACE_WITH_YOUR_ASSRT_TOKEN"
      RESULTS_PER_SOURCE: "10"
      REQUEST_TIMEOUT_MS: "10000"
      ZIMUKU_BASE_URLS: "https://zimuku.org,https://srtku.com"
      SUBHD_BASE_URLS: "https://subhd.tv,https://subhd.me,https://subhd.one,https://subhd.cc"
    ports:
      - "127.0.0.1:7000:7000"
